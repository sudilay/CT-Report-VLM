<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metin-hatti-title metin-hatti-desc">
        <title id="metin-hatti-title">CT-Report-VLM metin işleme hattı</title>
        <desc id="metin-hatti-desc">Hekim raporu ve model üretimi rapor iki ayrı giriş noktasından cümle bölütlemeye girer, varlık çıkarımı ve bağlam çözümlemesinden geçer, malignite değerlendirme şemasına bağlanır ve seri düzeyi yapılandırılmış çıktı üretir; sözlükler ve çıkarım şeması hatta yandan bağlanır, bağlam katmanı ölçülmüş zayıf nokta olarak işaretlidir.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ZONES (painted before arrows and nodes) ============ -->
        <rect x="40" y="168" width="240" height="344" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="52" y="172" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="110" y="181" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GİRDİ VE SÖZLEŞME</text>

        <rect x="340" y="168" width="600" height="344" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="352" y="172" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="408" y="181" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ÇIKARIM KATMANI</text>

        <rect x="980" y="168" width="220" height="344" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="992" y="172" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1042" y="181" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEĞERLENDİRME</text>

        <!-- ============ ARROWS (before boxes) ============ -->

        <!-- A Hekim raporu -> D Cümle bölütleme : straight, shared y -->
        <line x1="240" y1="228" x2="352" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- B VLM raporu -> D bottom @ x=412 -->
        <path d="M 240 348 H 404 Q 412 348 412 340 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- C Bölünme kilidi -> D bottom @ x=468 -->
        <path d="M 240 468 H 460 Q 468 468 468 460 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- D -> E -->
        <line x1="520" y1="228" x2="552" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- E -> F -->
        <line x1="720" y1="228" x2="752" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- F -> H : the one accent flow, leaving the focal node -->
        <line x1="920" y1="228" x2="992" y2="228" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- H -> I : straight, shared x -->
        <line x1="1080" y1="256" x2="1080" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- G Sözlükler -> E : straight, shared x, dashed (passive attachment) -->
        <line x1="640" y1="380" x2="640" y2="260" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
        <!-- G -> F : elbow, dashed -->
        <path d="M 720 428 H 832 Q 840 428 840 420 V 260" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

        <!-- ============ ARROW LABELS (masked, 8px clear of the stroke) ============ -->
        <rect x="270" y="328" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="310" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TORAKS KAPSAMI</text>

        <rect x="308" y="448" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPLIT KİLİTTEN</text>

        <rect x="926" y="208" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="217" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FİLTRELENMİŞ</text>

        <rect x="588" y="312" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="628" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">SÖZLÜK</text>

        <rect x="792" y="332" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="828" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">İPUCU</text>

        <!-- ============ EDITORIAL CALLOUT ============ -->
        <text x="1240" y="104" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Türkçe kol burada ayrışır</text>
        <path d="M 1060 112 Q 860 128 640 196" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="640" cy="196" r="2" fill="#2d3142"/>

        <!-- ============ NODES ============ -->

        <!-- A · Hekim raporu (input) -->
        <rect x="80" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="200" width="160" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="88" y="208" width="36" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="106" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GİRDİ</text>
        <text x="160" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hekim raporu</text>
        <text x="160" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CT-RATE · BIMCV-R</text>

        <!-- B · VLM raporu + adaptör (input) -->
        <rect x="80" y="320" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="320" width="160" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="88" y="328" width="36" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="106" y="337" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GİRDİ</text>
        <text x="160" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VLM raporu</text>
        <text x="160" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">astra-sozlesme-1.1</text>

        <!-- C · Bölünme kilidi (state / lock) -->
        <rect x="80" y="440" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="440" width="160" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="88" y="448" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="106" y="457" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KİLİT</text>
        <text x="160" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bölünme kilidi</text>
        <text x="160" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">astra-split-1.0</text>

        <!-- D · Cümle bölütleme (step) -->
        <rect x="360" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="368" y="208" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="378" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
        <text x="440" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cümle bölütleme</text>
        <text x="440" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seg-1.1 · tmpl-1.0</text>

        <!-- E · Varlık ve ölçü çıkarımı (step) -->
        <rect x="560" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="208" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="578" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
        <text x="640" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Varlık ve ölçü</text>
        <text x="640" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ent-1.1 · meas-1.2</text>

        <!-- F · Bağlam çözümleme — THE ONE FOCAL NODE (measured weak point) -->
        <rect x="760" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="200" width="160" height="56" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="768" y="208" width="20" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="778" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
        <text x="840" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bağlam çözümleme</text>
        <text x="840" y="250" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ctx-1.1 · prior F1 %36,4</text>

        <!-- G · Sözlükler ve şema (config store) -->
        <rect x="560" y="380" width="160" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="380" width="160" height="96" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="568" y="388" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="582" y="397" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
        <text x="640" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sözlükler ve şema</text>
        <text x="640" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">anat-1.1 · bulgu-1.2</text>
        <text x="640" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ipucu-1.0</text>
        <text x="640" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEMA-1.3 YAZMA KAPISI</text>

        <!-- H · Malignite değerlendirme şeması (step) -->
        <rect x="1000" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1000" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1008" y="208" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="1018" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
        <text x="1080" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Malignite şeması</text>
        <text x="1080" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sema-1.0 · altı düzey</text>

        <!-- I · Yapılandırılmış çıktı (store) -->
        <rect x="1000" y="380" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1000" y="380" width="160" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="1008" y="388" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="1022" y="397" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="1080" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Yapılandırılmış çıktı</text>
        <text x="1080" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seri düzeyi tablo</text>

        <!-- ============ LEGEND — horizontal strip, outside the zones ============ -->
        <line x1="40" y1="548" x2="1240" y2="548" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GÖSTERGE</text>

        <rect x="40" y="592" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <text x="60" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Girdi</text>

        <rect x="160" y="592" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="180" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">İşlem adımı</text>

        <rect x="320" y="592" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="340" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ölçülmüş zayıf nokta</text>

        <rect x="560" y="592" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="580" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kilit, yapılandırma, çıktı</text>

        <line x1="800" y1="597" x2="814" y2="597" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
        <text x="824" y="601" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Sözlük bağlantısı</text>
      </svg>
