        <rect x="12" y="180" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="24" y="202" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Görüntü risk skoru</text>

        <rect x="232" y="180" width="148" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.6"/>
        <text x="306" y="202" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">VAR</text>

        <rect x="396" y="180" width="148" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.6"/>
        <text x="470" y="202" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">VAR</text>

        <rect x="560" y="180" width="148" height="36" rx="4" fill="#b85450" fill-opacity="0.12" stroke="#b85450" stroke-opacity="0.45" stroke-width="1"/>
        <text x="634" y="198" fill="#b85450" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">YOK</text>
        <text x="634" y="210" fill="#b85450" fill-opacity="0.85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">görüntü işlenmedi</text>

