<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 756 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="veri-acmazi-title veri-acmazi-desc">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
        <title id="veri-acmazi-title">CT-Report-VLM veri açmazı</title>
        <desc id="veri-acmazi-desc">Üç kohortun ana hipotez için gereken üç veri gereksinimini karşılama durumunu gösteren matris. NLST'de gerçek hekim raporu yok, BIMCV-R'de doğrulanmış kanser sonucu yok, CT-RATE'te hem risk skoru hem kanser sonucu yok; hiçbir kohortta üçü birden bulunmadığı için hipotez doğrudan sınanamıyor.</desc>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= HEADER ROW (y=72, h=52) ================= -->
        <rect x="12" y="72" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="116" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gereksinim</text>
        <text x="116" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kohorta göre</text>

        <rect x="232" y="72" width="148" height="52" rx="6" fill="#2d3142"/>
        <text x="306" y="92" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NLST</text>
        <text x="306" y="108" fill="#f5f5f5" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1.201 hasta</text>

        <rect x="396" y="72" width="148" height="52" rx="6" fill="#2d3142"/>
        <text x="470" y="92" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BIMCV-R</text>
        <text x="470" y="108" fill="#f5f5f5" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">315 hasta</text>

        <rect x="560" y="72" width="148" height="52" rx="6" fill="#2d3142"/>
        <text x="634" y="92" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CT-RATE</text>
        <text x="634" y="108" fill="#f5f5f5" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">21.304 hasta</text>

        <!-- ================= ROW 0 · Gerçek hekim raporu (y=140) ================= -->
        <rect x="12" y="140" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="24" y="162" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Gerçek hekim raporu</text>

        <!-- FOCAL: NLST'nin tek eksiği -->
        <rect x="232" y="140" width="148" height="36" rx="4" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="306" y="158" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">YOK</text>
        <text x="306" y="170" fill="#eb6c36" fill-opacity="0.85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tek eksik parça</text>

        <rect x="396" y="140" width="148" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.6"/>
        <text x="470" y="162" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">VAR</text>

        <rect x="560" y="140" width="148" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.6"/>
        <text x="634" y="162" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">VAR</text>

