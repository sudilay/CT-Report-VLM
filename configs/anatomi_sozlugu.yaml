# Toraks BT anatomi sozlugu  ·  TASK-11  ·  surum: anat-1.1
#
# KAYNAK: korpus frekans madeni (YALNIZCA train - 449.868 cumle, 20.000 hasta).
# Ders kitabindan terim kopyalanmadi; her kavram korpusta gecen yuzeylerden dogdu.
# Bu D16'nin mantigidir: ithal sozluk baslangic noktasidir, bitis noktasi degil.
#
# RADLEX NOTU - onemli:
#   RadLex eslemesi YAPILMADI. RadLex BioPortal hesabi gerektiriyor ve elimizde yok.
#   RadLex kimligi EZBERDEN YAZILMAZ - uydurma kimlik, kimliksiz olmaktan kotudur.
#   Bu sozlukteki kavram kimlikleri YERELDIR: concept_source = "yerel_sozluk".
#   Semada radlex yuvasi hazir; erisim saglaninca `radlex` alani doldurulur ve
#   concept_source "radlex" olur. Uretilen veri bozulmaz, kolon zenginlesir.
#
# DESEN KURALLARI:
#   - Hepsi kucuk/buyuk harf duyarsiz eslesir
#   - Kelime siniri otomatik eklenir
#   - EN UZUN eslesme kazanir ("upper lobe" > "lobe")
#   - taraf_alir: bu kavram sag/sol/iki tarafli olabilir mi

surum: anat-1.1
tarih: 2026-08-26

