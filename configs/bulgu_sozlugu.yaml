# =====================================================================
# OLCULUP ALINMAYANLAR (bulgu-1.1) - reddedilenler de kayittir
# =====================================================================
# Kor listelemede isaretleyicilerin yazdigi ama sozluge ALINMAYAN terimler.
# Alinmama gerekcesi sayiyla birlikte yazilir; ileride yeniden tartisilabilir.
#
#   wall                 27.251  REDDEDILDI - tek basina bulgu/anatomi degil,
#                                daima niteleyen: "chest wall", "bronchial wall",
#                                "wall thickening". chest_wall zaten var;
#                                "bronchial wall" bronchus'a, "wall thickening"
#                                thickening'e esliyor. Ciplak 'wall' gurultu uretir.
#   aneurysmatic appear.     22  REDDEDILDI - cok seyrek; 'aneurysm' kapsiyor.
#   shrinkage                44  REDDEDILDI - cok seyrek ve belirsiz yuzey.
#   hepatic steotase          1  REDDEDILDI - kaynak yazim hatasi, TEK ornek.
#                                Bunun yerine 'steatosis' deseni eklendi (+499).
#
# ANATOMIC_SEGMENT KARARI (olculerek verildi, 2026-08-28):
#   Iki bagimsiz isaretleyici "segment" span'ina 18 kez itiraz etti: desen
#   ciplak "segments?" ve 26.468 anmanin yalnizca 98'i gercekten ciplak;
#   gerisinde onunde tanimlayici var ("basal segment", "liver segment 5").
#
#   SPAN'I UZATMA REDDEDILDI: onundeki tanimlayicilarin 25.028'i ZATEN
#   sozlukte esleniyor - basal/apical/laterobasal 'distribution' niteleyicisi,
#   lingular 'lingula' anatomisi. Span'i uzatmak bu eslesmeleri yutar ve
#   niteleyici bilgisini KAYBETTIRIR. Kazanctan buyuk kayip.
#
#   KAVRAMI SILME DE REDDEDILDI: 22.344 cumlenin %92'sinde yaninda lob veya
#   dagilim niteleyicisi var (yani orada gercekten fazlalik), AMA %8'inde
#   (1.893 cumle) HICBIRI yok ve segment tek basina bilgi tasiyor:
#     "millimetric calcification at the level of liver segment 5"
#     "the examination at the level of the liver segment 5-8 was unenhanced"
#   Bunlar KARACIGER segmentasyonu; lob/dagilim ekseninde karsiligi yok.
#   Silinseydi 1.893 cumlede yer bilgisi tamamen kaybolurdu.
#
#   SONUC: KORUNUYOR. Bilinen sinir olarak kayda gecti - span dar, cogu
#   yerde fazlalik, ama %8'de tasiyici. Isaretleyici itirazi span estetigi
#   hakkindadir, bilgi kaybi hakkinda degil.
