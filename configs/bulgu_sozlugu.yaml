# =====================================================================
# OLCULUP ALINMAYANLAR (bulgu-1.1) - reddedilenler de kayittir
# =====================================================================
# Kor listelemede isaretleyicilerin yazdigi ama sozluge ALINMAYAN terimler.
# Alinmama gerekcesi sayiyla birlikte yazilir; ileride yeniden tartisilabilir.
#

  # ═════════════════════════════════════════════════════════════════════
  # TASK-17 madde 7 - TIER A ve TIER B GENISLETMESI  (D74 · D83 · D85)
  # ═════════════════════════════════════════════════════════════════════
  # D74 "sifir destekli girdi olmaz" kuralini KOSULLU gevsetti. Her yeni
  # girdi UC alan tasir: `kaynak`, `korpus_destegi` (0 olabilir), `amac`.
  # Boylece kapsam iddiasi sismez: "N'si olculmus destekli, M'si transfer".
  #
  # ⚠ `korpus_destegi` degerleri OLCULDU (scripts/55 -> reports/
  # task17_tier_siniflandirma.json, gelistirme havuzu 383.644 cumle).
  # D74'un "lymphoma/sarcoma/mesothelioma sifir gecer" VARSAYIMI YANLIS
  # cikti (D83); asagidaki sayilar olcumdur, tahmin degil.
  #
  # ⛔ OLCULUP REDDEDILEN DESEN PARCALARI - neden alinmadigi sorulmasin:
  #   `concentric`      16 cumle, TAMAMI damar/duvar ("concentric wall
  #                     thickness"), kalsifikasyon paterni DEGIL
  #   `diffuse calcifi` 491 cumle, TAMAMI damar ateromu ("diffuse calcific
  #                     atheroma plaques in the aorta") - Lung-RADS'in
  #                     "complete calcification"i ile AYNI KAVRAM DEGIL
  #   `malignant`       142 cumle - SIFAT. Gozlem kavrami olarak eklenirse
  #                     D24 ihlal edilir ("kavram adi metnin soylemedigini
  #                     iddia edemez"); niteleyici olarak ele alinmali,
  #                     ACIK KALEM (D85)
  #   `nodular_lesion`  2.793 cumle - kavram ZATEN VAR ama malignite
  #                     envanterinde yok. Eklenmesi `C#nodul-kalip` (D81)
  #                     korumasinin ona da genisletilmesini gerektirir;
  #                     korumasiz eklenirse ~1.935 calisma haksiz yere
  #                     maligniteye kayar. ACIK KALEM (D85)

  # ---- TIER A · malignite ekseni (olculmus destek) ----
  carcinomatosis:
    tip: observation
    desenler: ["carcinomat\\w*"]
    korpus: 118
    kaynak: "alan sozlugu §15 (WHO 2021'e ATIFLA) · D74'un ilk maddesi | belge: alan_sozlugu.docx"
    korpus_destegi: 118
    amac: olculmus
    not: "Lenfanjitik/peritoneal karsinomatoz. ES ANLAMLI DEGIL, AYRI kavram.
      Cakisma denetlendi: `carcinomas?\\b` kelime siniri yuzunden bunun
      icinde ESLESMEZ (carcinoma'dan sonra 't' geliyor)."
  malignancy:
    tip: observation
    desenler: ["malignanc(?:y|ies)"]
    korpus: 109
    kaynak: "alan sozlugu §15 | belge: alan_sozlugu.docx"
    korpus_destegi: 109
    amac: olculmus
    not: "YALNIZ isim bicimi. Sifat `malignant` (142 cumle) BILEREK DISARIDA -
      niteleyici olarak ele alinmali, D24 geregi gozlem kavrami yapilamaz."
  neoplasm:
    tip: observation
    desenler: ["neoplas\\w*"]
    korpus: 29
    kaynak: "alan sozlugu §15 (WHO 2021'e ATIFLA) | belge: alan_sozlugu.docx"
    korpus_destegi: 29
