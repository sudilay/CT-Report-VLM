#   wall                 27.251  REDDEDILDI - tek basina bulgu/anatomi degil,
#                                daima niteleyen: "chest wall", "bronchial wall",
#                                "wall thickening". chest_wall zaten var;
#                                "bronchial wall" bronchus'a, "wall thickening"
#                                thickening'e esliyor. Ciplak 'wall' gurultu uretir.
#   aneurysmatic appear.     22  REDDEDILDI - cok seyrek; 'aneurysm' kapsiyor.
#   shrinkage                44  REDDEDILDI - cok seyrek ve belirsiz yuzey.
#   laterobasal           1.958  GERI ALINDI - eklendi, sonra kaldirildi.
#                                'basal' deseni ZATEN "laterobasal" iceriyor
#                                (['basal','posterobasal','laterobasal','basally']).
#                                Eklenen kavram ERISILEMEZDI: birlesik regex'te
#                                esit uzunlukta eslesme ilk dala gidiyor ve
#                                korpusta 0 anma uretti. Ders: yeni kavram
#                                eklemeden once MEVCUT desenlerin o yuzeyi
#                                kapsayip kapsamadigi denetlenmeli.
#   hepatic steotase          1  REDDEDILDI - kaynak yazim hatasi, TEK ornek.
#                                Bunun yerine 'steatosis' deseni eklendi (+499).
#
# ANATOMIC_SEGMENT KARARI (olculerek verildi, 2026-08-28):
#   Iki bagimsiz isaretleyici "segment" span'ina 18 kez itiraz etti: desen
#   ciplak "segments?" ve 26.468 anmanin yalnizca 98'i gercekten ciplak;
#   gerisinde onunde tanimlayici var ("basal segment", "liver segment 5").
#
#   SPAN'I UZATMA REDDEDILDI: onundeki tanimlayicilarin 25.028'i ZATEN
#   sozlukte esleniyor - basal/apical/laterobasal 'distribution' niteleyicisi,
#   lingular 'lingula' anatomisi. Span'i uzatmak bu eslesmeleri yutar ve
#   niteleyici bilgisini KAYBETTIRIR. Kazanctan buyuk kayip.
#
#   KAVRAMI SILME DE REDDEDILDI: 22.344 cumlenin %92'sinde yaninda lob veya
#   dagilim niteleyicisi var (yani orada gercekten fazlalik), AMA %8'inde
#   (1.893 cumle) HICBIRI yok ve segment tek basina bilgi tasiyor:
#     "millimetric calcification at the level of liver segment 5"
#     "the examination at the level of the liver segment 5-8 was unenhanced"
#   Bunlar KARACIGER segmentasyonu; lob/dagilim ekseninde karsiligi yok.
#   Silinseydi 1.893 cumlede yer bilgisi tamamen kaybolurdu.
#
#   SONUC: KORUNUYOR. Bilinen sinir olarak kayda gecti - span dar, cogu
#   yerde fazlalik, ama %8'de tasiyici. Isaretleyici itirazi span estetigi
#   hakkindadir, bilgi kaybi hakkinda degil.

# =====================================================================
# TARTISMALI KAVRAM KARARLARI (olculerek, 2026-08-28) - DONDURMA ONCESI
# =====================================================================
# Iki bagimsiz isaretleyicinin K4 farkinin (%99 vs %86) kaynagi dort kavramdi.
# Bunlar KURAL BOSLUGU DEGIL, span/granulerlik tartismasiydi. Dondurmadan once
# dordu de olculdu; hicbiri degistirilmedi, hepsinin gerekcesi asagida.
#
# 1) pneumonia <- "pneumonic infiltration"        3.533 anma
#    KORUNUYOR. Pnomonik infiltrasyon pnomoninin radyolojik bulgusudur; ayri
#    kavram olarak tutmak klinik olarak yanlis ayrim yaratirdi. CIFT SAYIM YOK:
#    ayni cumlede ayrica 'infiltration' kavrami yalnizca 7 kez esliyor.
#
# 2) abdomen <- "upper abdominal"                 21.082 / 29.072 anma (%72)
#    KORUNUYOR. Toraks BT'de goruntulenen abdomen ZATEN ust abdomendir; ayrim
#    bu korpusta bos bir ayrimdir. KAPSAMA BAGLI karardir: korpus toraks disina
#    genisletilirse yeniden degerlendirilmeli.
#
# 3) density <- "densities/opacities"             19.334 anma
#    KORUNUYOR. Ayrisma ilkelidir: "X density" kaliplari niteleyici + gozlem
#    olarak COZULUR, bilgi kaybolmaz:
#      "ground glass densities" -> qualifier(ground_glass) + observation(density)
#      "nodular densities"      -> observation(nodular_lesion)   [bilesik kavram]
#      "soft tissue densities"  -> observation(soft_tissue_density)  [AYRILDI]
#    soft_tissue AYRILDI cunku 'soft tissue' bizde ANATOMIDIR; ayrilmasaydi
#    "yumusak dokuda dansite" gibi YANLIS bir ayrisma uretirdi. ground_glass
#    ise niteleyici oldugu icin ayrisma dogrudur.
#
# 4) anatomic_segment <- "segments?"              25.627 anma
#    KORUNUYOR - gerekcesi yukarida ayrica yazili.
