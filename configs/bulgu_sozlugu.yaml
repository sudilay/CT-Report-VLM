# Bulgu, niteleyici ve cihaz sozlugu  ·  TASK-11  ·  surum: bulgu-1.0
#
# KAYNAK: korpus frekans madeni (YALNIZCA train - 449.868 cumle, 20.000 hasta).
# Her 'korpus' degeri OLCULDU; elle yazilmadi.
# SAYIM TABANI: train (449.868 cumle). extraction_schema.json'daki niteleyici
# sayilari TUM korpus (479.051) uzerinden olculdu - kucuk farklar bundandir.
#
# Ceviri artefaktlari korunmustur - bu korpus Turkce yazilip Ingilizceye cevrildi:
#   "space-occupying lesion"   <- yer kaplayici lezyon
#   "effusion-thickening"      <- efuzyon-kalinlasma  (tek tireli bilesik)
#   "lytic-destructive lesion" <- litik-destruktif lezyon
#   "natural calibration"      <- kalibrasyonu tabii  (damar/ozofagus normallik beyani)
#   "sequela changes"          <- sekel degisiklikler
# Standart Ingilizce radyoloji sozlugu bu yuzeylerin HICBIRINI icermez.

