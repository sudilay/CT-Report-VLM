# TURKCE YUZEY ADAYLARI - TASK-17  ·  surum: aday-0.3  ·  HAZIRLIK DOSYASI
#
# ⛔ BU DOSYA SOZLUK DEGILDIR. Buradaki hicbir yuzey `bulgu_sozlugu.yaml`e
#    ya da `turkce_yuzeyler_taslak.yaml`a HENUZ alinmamistir. Alinmasi
#    docs/34 v2 madde 10'un isidir ve Tier A/B calismasindan SONRA gelir.
#
# BAGLAYICI KURAL (docs/34 v2 §4.4, denetim B7 · docs/35 §8):
#   "Kaynagi olmayan hicbir Turkce yuzey bulgu_sozlugu.yaml'a girmez."
#
# ═══ SURUM 0.1 -> 0.2 (2026-09-04) ═══
#   0.1'de 36 adayin 35'i `kaynak: yok` idi - arastirma kunye vermemisti.
#   0.2'de KUNYELER GELDI: her yuzey icin yayin adi, link ve dogrudan alinti.
#   ✅ B7 BLOKAJI KALKTI. Adaylar madde 10 icin uygun hale geldi.
#
#   ⚠ Kalan tek istisna: `space_occupying_lesion` - arastirma pozisyonunu
#     korudu ("rutin toraks BT rapor yuzeyi degil"). Bizim kendi olcumumuz
#     aksini soyluyor; ikisi de kayitli, ayrintisi girdide.
#
# ═══ KUNYENIN SINIRI - ne kanitliyor, ne kanitlamiyor ═══
#   Bu kunyeler bir yuzeyin TURK RADYOLOJI LITERATURUNDE kullanildigini
#   kanitlar. HEDEF KOHORTTA (Bakanlik verisi) hangi siklikta gectigini
#   kanitlamaz - o olculmemistir ve olculemez (veri elde yok).
#   Bu yuzden `korpus_destegi` alanlari ayri tutuldu.

surum: aday-0.2
durum: kismen_mezun   # 16 aday tr-1.1'e ALINDI (D91); complete_calcification BEKLIYOR (kunye yok)
tarih: 2026-09-04
uzman_onayi: false          # hicbir yuzey klinik uzman onayindan gecmedi (D71)

