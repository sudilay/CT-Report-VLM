# ═══════════════════ ADAYLAR ═══════════════════

adaylar:

  # ============ A · MALIGNITE EKSENI - CEKIRDEK ============

  carcinomatosis:
    yuzeyler: ["pulmoner lenfanjitik karsinomatozis", "karsinomatozis", "peritoneal karsinomatoz"]
    govde: ["karsinomatoz"]         # `karsinomatozis`i de kapsar
    kisaltma: ["PLK"]
    tr10: yok
    kaynak:
      - { anahtar: TRS-23125, kanit: "'Pulmoner Lenfanjitik Karsinomatozis' baslik olarak ve PLK kisaltmasi dogrudan kullaniliyor" }
      - { anahtar: TK-PERITONEAL, kanit: "'Peritoneal karsinomatoz' makale basliginda ve metinde" }
    korpus_destegi: olculmedi       # RadTr'de olculecek
    amac: transfer
    not: >-
      ⭐ TASK-17 Tier A'nin ILK maddesi (D74). Iki kunye iki farkli soneki
      belgeliyor: TORAKS -> `karsinomatozis`, ABDOMINAL -> `karsinomatoz`.
      `karsinomatoz` govdesi ikisini birden kapsar.
      `PLK` kisaltmasinin Ingilizce karsiligi YOKTUR - `CTO`/`KTO`
      sinifinda bir yuzey; hazir sozluk asla yakalayamaz.

  malignancy:
    yuzeyler: ["malignite", "malignite ihtimali", "primer malignite"]
    govde: ["malignit"]
    tr10: yok
    kaynak:
      - { anahtar: TGKDC-903, kanit: "'Malignite ihtimali nedeniyle...' dogrudan" }
      - { anahtar: BEZMIALEM-TORAKSBT, kanit: "'primer malignite tanisi' kullanimi" }
    korpus_destegi: olculmedi
    amac: transfer
    not: "Tier A. Semada kavram olarak YAZILI ama sozlukte yok - bugun olu satir."

  carcinoma:
    yuzeyler: ["karsinom"]
    govde: ["karsinom"]
    tr10: yok
    kaynak:
      - { anahtar: KOSUYOLU-AKCIGER, kanit: "'skuamoz hucreli karsinom', 'buyuk hucreli karsinom'" }
      - { anahtar: TK-PERITONEAL, kanit: "karsinom/karsinomatoz terminolojisi" }
    korpus_destegi: olculmedi
    amac: transfer
    not: >-
      ⚠⚠ CAKISMA - COZULMESI ZORUNLU: `karsinom` govdesi `karsinomatoz`u
      da yakalar. EN UZUN ESLESME KAZANIR kurali uygulanmazsa
      `carcinomatosis` HIC uretilmez ve Tier A'nin ilk maddesi olu dogar.
      Bu, `nodule`/`nodular_lesion` icin daha once cozulmus bir problemin
      aynisi (bulgu_sozlugu.yaml satir 30-40).

  metastasis:
    yuzeyler: ["metastaz", "metastatik", "metastatik nodul", "metastatik kitle lezyonu", "metastatik lezyon"]
    govde: ["metastaz", "metastat"]
    tr10: "VAR - desen: metastaz (radtr=7)"
    kaynak:
      - { anahtar: BEZMIALEM-TORAKSBT, kanit: "Gercek radyoloji raporlari su terimlerle TARANMIS: 'metastaz', 'metastatik nodul', 'metastatik kitle lezyonu', 'kitlesel lezyon'" }
    korpus_destegi: "tr-1.0'da olculdu (RadTr 7)"
    amac: olculmus
    not: >-
      ⭐ Kunye rapor yuzeyi kaniti olarak en gucludur (bkz. kaynak notu).
      tr-1.0'da yalniz `metastaz` var; `metastat` govdesi `metastatik`
      sifatini kaciriyor olabilir - OLCULECEK.

  tumor:
    yuzeyler: ["tumor"]
    govde: ["tumor"]
    tr10: "VAR - desen: t[uü]m[oö]r|neoplaz|kitlesel (radtr=4)"
    kaynak:
      - { anahtar: TRS-23125, kanit: "'tumor hucreleri' dogrudan" }
    korpus_destegi: "tr-1.0'da olculdu (RadTr 4)"
    amac: olculmus

  neoplasm:
    yuzeyler: ["neoplazi", "neoplazm"]
    govde: ["neoplaz"]
    tr10: "AYRI DEGIL - `tumor` desenine katilmis"
    kaynak: yok
    korpus_destegi: olculmedi
    amac: transfer
    not: >-
      ⚠ ACIK TASARIM SORUSU (madde 10'da cozulecek): tr-1.0 `neoplaz`i
      ayri kavram yapmayip `tumor` desenine katmis. Tier A `neoplasm`i
      AYRI kavram yapiyor. Iki dosya celisecek - biri secilmeli.
      Kunye de gelmedi; arastirma bu maddeyi ayrica ele almamis.

  mass:
    yuzeyler: ["kitle", "kitle lezyonu", "kitlesel lezyon"]
    govde: ["kitle", "kitlesel"]
    tr10: "VAR ama BOLUNMUS - `kitle` -> mass (radtr=22) · `kitlesel` -> TUMOR"
    kaynak:
      - { anahtar: TGKDC-932, kanit: "'kitle' ve 'kitle lezyonu' dogrudan" }
      - { anahtar: BEZMIALEM-TORAKSBT, kanit: "'kitlesel lezyon' rapor arama terimi olarak kullanilmis" }
    korpus_destegi: "tr-1.0'da olculdu (RadTr 22)"
    amac: olculmus
    not: >-
      ⚠⚠ CELISKI - KUNYE ILE GUCLENDI (madde 10'da cozulecek).
      tr-1.0 `kitlesel`i `mass`a degil `TUMOR` desenine koymus. Ama
      BEZMIALEM calismasi "kitlesel lezyon"u GERCEK RAPOR arama terimi
      olarak kullaniyor ve bu birebir "mass lesion" demektir.
      Olasi bir tr-1.0 yanlis atamasi; artik kunyeli kanit var.

  nodule:
    yuzeyler: ["nodul", "noduler"]
    govde: ["nodul"]
    tr10: "VAR - desen: nod[uü]l (radtr=190, en yuksek)"
    kaynak:
      - { anahtar: TGKDC-1194, kanit: "Pulmoner nodul terminolojisi ve nodul karakterizasyonu" }
      - { anahtar: SOLUNUM-EP019 }
    korpus_destegi: "tr-1.0'da olculdu (RadTr 190)"
    amac: olculmus
    not: "tr-1.0 deseni sapkali/sapkasiz ve `noduler`i zaten kapsiyor (D58 onarimi). Yeni girdi gerekmiyor."

  spiculated:
    yuzeyler: ["spikule", "spikuler"]
    govde: ["spikul"]
    tr10: "VAR - desen: spik[uü]l (radtr=2)"
    kaynak:
      - { anahtar: TGKDC-1194, kanit: "'spikuler kenar' dogrudan" }
      - { anahtar: IU-ACIKERISIM, kanit: "'spikule uzantili ... kitlesel lezyon'" }
    korpus_destegi: "tr-1.0'da olculdu (RadTr 2)"
    amac: olculmus

  lytic_destructive_lesion:
    yuzeyler: ["litik lezyon", "osteolitik lezyon", "destrukte eden kitle", "destrukte eden lezyon"]
    govde: ["litik", "osteolitik", "destruk"]
    tr10: "VAR - desen: litik|destr[uü]ktif (radtr=3)"
    kaynak:
      - { anahtar: TGKDC-932, kanit: "'kotu destrukte eden kitle' dogrudan" }
      - { anahtar: KANSER-KONGRE-232, kanit: "'litik karakterli' metastatik kemik lezyonu baglaminda" }
    korpus_destegi: "tr-1.0'da olculdu (RadTr 3)"
    amac: olculmus
    not: >-
      Kunye `destrukte` (FIIL bicimi) ve `osteolitik` ekliyor; tr-1.0'da
      yalniz `destr[uü]ktif` (SIFAT) var. `destruk` govdesi ikisini kapsar.

  space_occupying_lesion:
    yuzeyler: ["yer kaplayan lezyon", "yer kaplayici lezyon"]
    govde: ["yer kaplay"]
    tr10: "VAR - desen: yer kaplayan lezyon (radtr=1)"
    kaynak:
      - { anahtar: "IC-KAYIT", kanit: "bulgu_sozlugu.yaml satir 9: ceviri artefakti kaydi - 'space-occupying lesion <- yer kaplayici lezyon' (CT-RATE'te 18.315 cumle)" }
      - { anahtar: "IC-OLCUM", kanit: "RadTr train+dev olcumu 2026-09-04: 'yer kaplayan' 1 · 'yer kaplayici' 0" }
    korpus_destegi: "CT-RATE 18.315 (Ingilizce) · RadTr 1"
    amac: olculmus
    not: >-
      ⚠ ARASTIRMA ILE AYRISMA - IKISI DE KAYITLI.
      Arastirmanin pozisyonu (iki kez, degistirmedi): "'yer kaplayici/
      kaplayan lezyon' Turkce tip literaturunde mevcut ama RUTIN TORAKS BT
      RAPOR YUZEYI olarak high-confidence listeye eklenmemeli."
      Bizim pozisyonumuz: bu korpus icin soru "rutin mi" degil, "BU VERIDE
      var mi". Iki ic kanit var - `bulgu_sozlugu.yaml` bu kavrami CEVIRI
      ARTEFAKTI olarak kaydediyor (yani CT-RATE'in Turkce ORIJINALI bu
      ifadeyi tasiyor, 18.315 cumle) ve tr-1.0 RadTr'de olcmus.
      Ikisi CELISMIYOR: arastirma genel literaturden, biz bu korpustan
      konusuyoruz. ⚠ IKI BICIM FARKLI KORPUSTA: RadTr `kaplayan`,
      CT-RATE kaydi `kaplayici`. Bakanlik UCUNCU korpus -> desen IKISINI
      DE kapsamali (`yer kaplay`).

  # ============ B · HISTOLOJIK ALT TIPLER (hepsi Tier B, olcum-notr) ============

  adenocarcinoma:
    yuzeyler: ["adenokarsinom"]
    govde: ["adenokarsinom"]
    tr10: yok
    kaynak: [{ anahtar: TK-ADENOKARSINOM }]
    korpus_destegi: 0
    amac: transfer

  squamous_cell_carcinoma:
    yuzeyler: ["skuamoz hucreli karsinom", "yassi hucreli karsinom", "yassi epitel hucreli karsinom", "epidermoid karsinom"]
    govde: ["skuamoz", "yassi hucre", "yassi epitel", "epidermoid"]
    tr10: yok
    kaynak: [{ anahtar: KOSUYOLU-AKCIGER, kanit: "skuamoz/epidermoid terminolojisi dogrudan" }]
    korpus_destegi: 0
    amac: transfer
    not: "Dort ayri yuzey - Turkcede tek yerlesik terim yok."

  small_cell_carcinoma:
    yuzeyler: ["kucuk hucreli akciger kanseri", "kucuk hucreli karsinom"]
    govde: ["kucuk hucreli"]
    kisaltma: ["KHAK"]
    tr10: yok
    kaynak: [{ anahtar: TK-KHAK }]
    korpus_destegi: 0
    amac: transfer
    not: "`KHAK` kisaltmasi Ingilizce karsiliksiz - PLK sinifinda."

  large_cell_carcinoma:
    yuzeyler: ["buyuk hucreli karsinom"]
    govde: ["buyuk hucreli"]
    tr10: yok
    kaynak: [{ anahtar: KOSUYOLU-AKCIGER }]
    korpus_destegi: 0
    amac: transfer

  lymphoma:
    yuzeyler: ["lenfoma"]
    govde: ["lenfoma"]
    tr10: yok
    kaynak: [{ anahtar: ERBAKAN-LENFOMA }]
    korpus_destegi: 0
    amac: transfer

  sarcoma:
