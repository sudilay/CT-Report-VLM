      kaynak: [{ anahtar: OMU-PETBT, kanit: "'malign/benign hastalik ayrimi yapilamayan primer akciger lezyonu'" }]
      not: >-
        ⭐ D72 #6 ile BIREBIR ortusuyor: "no differentiation between malignant
        and benign could be made" -> `indeterminate`. Turkce karsiligi bulundu,
        yani iki dil ayni karari verebilir.
    metastaz_kuskusu:
      govde: ["metastaz kusku"]
      kaynak: [{ anahtar: OMU-PETBT, kanit: "'plevral metastaz kuskusu'" }]
    metastaz_suphesi:
      govde: ["metastaz suphe"]
      kaynak: [{ anahtar: TGKDC-744, kanit: "'metastaz suphesi'" }]
    malignite_ihtimali:
      govde: ["malignite ihtimal"]
      kaynak: [{ anahtar: TGKDC-903, kanit: "'Malignite ihtimali nedeniyle...'" }]
    malignite_ile_uyumlu:
      govde: ["malignite ile uyumlu"]
      kaynak:
        - { anahtar: TUBERK-TORAKS-2021, kanit: "'Malignite ile uyumlu nitelikte...'" }
        - { anahtar: ASYOD-2021, kanit: "'primer akciger malignitesi ile uyumlu kitlesel lezyon'" }
    malignensi_ile_uyumlu:
      govde: ["malignensi ile uyumlu"]
      kaynak: [{ anahtar: OMU-PETBT, kanit: "'malignensi ile uyumlu primer akciger lezyonu'" }]
      not: >-
        ⭐ LOANWORD/YAZIM ARTEFAKTI - standart olmayan ama BELGELENMIS.
        `CTO`/`KTO`, `PLK`, `KHAK` ile ayni sinif: hazir bir sozluk bunu
        ASLA yakalayamaz. Bu tur yuzeyler bu projenin varlik sebebidir.
    metastaz_ile_uyumlu:
      govde: ["metastaz ile uyumlu"]
      kaynak: [{ anahtar: ONKOLOJI-673 }]
    lehine:
      govde: ["lehine", "lehine degerlendir"]
      kaynak:
        - { anahtar: ONKOLOJI-787, kanit: "'metastatik lezyonlar lehine'" }
        - { anahtar: KANSER-KONGRE-232, kanit: "'ikinci primer tumor lehine degerlendirilen' · 'metastaz lehine degerlendirilen'" }
      not: >-
        ⚠⚠ EN KRITIK ESLESME. Bu, korpustaki `in favor of`un TURKCE
        ORIJINALIDIR (7.910 anma, ipucu_sozlugu.yaml satir 180-183; oradaki
        not zaten "Turkce '...lehine degerlendirilmistir'" diyor).
        D29 bunu BELIRSIZLIK DEGIL cikarim ifadesi (`present`) saymisti.
        Turkce hat AYNI karari uygulamali - yoksa iki dil ayni cumleyi
        farkli sinifa koyar ve dil ablasyonu anlamsizlasir.
    ekarte_edilemez:
      govde: ["ekarte edil"]
      kaynak: [{ anahtar: YARGITAY-BT, kanit: "toraks BT raporu aktariminda 'metastatik tutulumun ekarte edilemedigi'" }]
      not: "⚠ Kunye ZAYIF (adli karar metni). Hakemli kaynak aranmali - acik kalem."
    dislanamaz:
      govde: ["dislan"]
      kaynak: [{ anahtar: SOLUNUM-EP020, kanit: "'primer akciger karsinomu dislanamadi'" }]
    ayirici_tani:
      govde: ["ayirici tani"]
      kaynak: [{ anahtar: TGKDC-1120, kanit: "'Ayirici tanida malignite...'" }]
      not: "Tek basina malignite kaniti DEGIL - yalniz diferansiyel tani baglami. D72 #16 ile uyumlu (-> indeterminate)."

