  # ============ C · BENIGN EKSENI - KALSIFIKASYON PATERNLERI ============
  # docs/34 v2 §4.4 (Karar 4 - kullanici acti ve onayladi).
  # ⚠ Bunlar `calcification_pattern` grubunda NITELEYICI olarak eklenir;
  #   BENIGN_KAVRAMLARI'ya ya da BENIGN_HUKUM_DESENI'ne GIRMEZLER.
  #   Varsayilan karar gucleri SIFIRDIR (docs/35 §4.2'de kanitlandi).

  popcorn_calcification:
    yuzeyler: ["patlamis misir seklinde kalsifikasyon", "popcorn kalsifikasyon", "popkorn kalsifikasyon"]
    govde: ["patlamis misir", "popcorn", "popkorn"]
    tr10: yok
    kaynak:
      - { anahtar: TGKDC-1194, kanit: "'diffuz, merkezi, lamellar ve patlamis misir seklinde (popcorn) kalsifikasyonlar' - artik sekil aciklamasinda 'Patlamis misir seklinde kalsifikasyon'" }
      - { anahtar: AKCIGER-BULTEN-2022, kanit: "'popcorn kalsifikasyon paterni'" }
    korpus_destegi: 0          # CT-RATE Ingilizce: 0 cumle (docs/30 §6.1)
    amac: transfer
    not: >-
      ⭐ Kullanicinin actigi sorunun (docs/34 §4.4) cikis noktasi ve
      cevabi. Sifir destekli oldugu icin OLCUMLE mezun OLAMAZ - kunye
      yolu zorunluydu ve KUNYE GELDI. Hakemli Turk radyoloji derlemesi
      terimi dogrudan kullaniyor.
      ⛔ `misir patlagi kalsifikasyon` DOGRULANMADI - alinmadi.

  laminated_calcification:
    yuzeyler: ["lamellar kalsifikasyon", "lameller kalsifikasyon", "laminer kalsifikasyon"]
    govde: ["lamellar", "lameller", "laminer"]
    tr10: yok
    kaynak:
      - { anahtar: TGKDC-1194, kanit: "'lamellar' ve 'lameller' bicimleri ayni kaynakta" }
      - { anahtar: AKCIGER-BULTEN-2022, kanit: "'laminer kalsifikasyon'" }
    korpus_destegi: 16         # CT-RATE: concentric/laminated 16 cumle
    amac: transfer
    not: "⛔ `konsantrik kalsifikasyon` high-confidence DEGIL - alinmadi."

  central_calcification:
    yuzeyler: ["merkezi kalsifikasyon", "santral kalsifikasyon"]
    govde: ["merkezi kalsifik", "santral kalsifik"]
    tr10: yok
    kaynak:
      - { anahtar: TGKDC-1194, kanit: "'merkezi kalsifikasyon' dogrudan" }
      - { anahtar: DEU-ACIKERISIM, kanit: "'santral' radyolojik terminoloji kullanimi" }
    korpus_destegi: 17
    amac: transfer

  complete_calcification:
    yuzeyler: ["tamamen kalsifiye", "tumuyle kalsifiye"]
    govde: ["tamamen kalsifi", "tumuyle kalsifi"]
    tr10: yok
    kaynak: yok               # ⚠ TR kunyesi YOK - EN tarafi olculdu, TR degil
    korpus_destegi: 3          # CT-RATE EN: "complete(?:ly)? calcifi" 3 cumle
    amac: olculmus
    durum: TR_KUNYESI_BEKLIYOR
    not: >-
      ⭐ ACIK SORU OLCUMLE CEVAPLANDI (D83, scripts/55). docs/34 §4.4 sormustu:
      "`diffuz kalsifikasyon` ile Lung-RADS'in `complete calcification`i AYNI
      KAVRAM MI?" -> **HAYIR.**
      Olculdu (gelistirme havuzu): `diffuse calcifi` **491 cumle** ve TAMAMI
      DAMAR ATEROMU ("Diffuse calcific atheroma plaques in the aorta and
      coronary arteries"). `complete(?:ly)? calcifi` ise **3 cumle** ve ucu de
      dogru ("completely calcific nodule measuring approximately 15 mm",
      "completely calcified lymph nodes").
      ⛔ Bu, Turkce terminoloji arastirmasinin "complete/diffuse calcification
      -> diffuz kalsifikasyon" onerisini CURUTUR. Eski girdi (`diffuse_
      calcification`) SILINDI; yerine dogru kavram (`complete_calcification`)
      kondu. Turkce yuzeyi TAHMINDIR ve kunye bekliyor - arastirma bu kavrami
      YANLIS esleyerek dogruladigi icin yeniden sorulmalidir.

  punctate_calcification:
    yuzeyler: ["noktasal kalsifikasyon"]
    govde: ["noktasal kalsifik"]
    tr10: "VAR - `punctate` deseni: punktat|noktasal (radtr=0)"
    kaynak: [{ anahtar: TGKDC-1194, kanit: "'noktasal kalsifikasyon' dogrudan" }]
    korpus_destegi: 50
    amac: olculmus
    not: "tr-1.0'da ZATEN VAR ve `noktasal`i kapsiyor. Yeni girdi GEREKMIYOR - kunye onu dogruluyor."

  granuloma:
    yuzeyler: ["granulom", "kalsifiye granulom"]
    govde: ["granulom"]
    tr10: "VAR - desen: gran[uü]lom (radtr=0)"
    kaynak: [{ anahtar: TRS-25220, kanit: "'kalsifiye granulom' dogrudan" }]
    korpus_destegi: "CT-RATE 117 · RadTr 0"
    amac: olculmus
    not: >-
      Arastirma: "`granulomatoz` ayni kavramin birebir esanlamlisi olarak
      KULLANILMAMALI." tr-1.0 ikisini zaten AYRI kavram tutuyor
      (`granuloma` / `granulomatous`) - uyumlu.

  hamartoma:
    yuzeyler: ["hamartom", "pulmoner hamartom"]
    govde: ["hamartom"]
    tr10: yok
    kaynak:
      - { anahtar: TGKDC-1240 }
      - { anahtar: AKCIGER-BULTEN-2022 }
    korpus_destegi: olculmedi
    amac: transfer

  fat_containing_nodule:
    yuzeyler: ["nodul icinde yag", "nodul icinde gorulen yag", "lezyon icinde yag", "yag icerigi"]
    govde: ["nodul icinde yag", "lezyon icinde yag", "yag iceri"]
    tr10: yok
    kaynak:
      - { anahtar: AKCIGER-BULTEN-2022, kanit: "'Lezyon icinde yag' ve 'bir nodul icinde gorulen yag' dogrudan" }
      - { anahtar: TGKDC-1194 }
    korpus_destegi: olculmedi
    amac: transfer
    durum: ONERILMIYOR
    not: >-
      ⚠ KUNYE GELDI ama TEKNIK ITIRAZ SURUYOR - girdi ONERILMIYOR.
      Kunye yuzeyin GERCEK oldugunu kanitliyor; DESEN OLARAK CALISIR
      oldugunu kanitlamiyor. Iki ayri gerekce:
      (a) Cok kelimeli sentaktik kaliplar kirilgandir - araya sifat girer
          ("nodul icinde MINIMAL yag"), desen kacirir. Arastirma da
          "Turkcede sabit tek terim yok" diyor.
      (b) CT-RATE olcumu Ingilizce `fat-containing` deseninin SISKIN
          oldugunu gosterdi: 1.126 eslesmenin cogu "fatty liver"
          (docs/30 §6.1). Turkce karsiliginda ayni risk var
          ("karaciger icinde yag").
      ONERI: alinmasin; alinacaksa ONCE olculsun.

  sequela:
    yuzeyler: ["sekel", "sekel degisiklik", "fibrotik sekel degisiklik"]
    govde: ["sekel"]
    tr10: "VAR - sequela: sekel (radtr=38) · sequela_change: sekel de[gğ]i[şs] (radtr=38)"
    kaynak:
      - { anahtar: TRS-25220 }
      - { anahtar: TUSAD-2021 }
    korpus_destegi: "CT-RATE 12.177 · RadTr 38"
    amac: olculmus
    not: "Korpusun BASKIN benign niteleyicisi. tr-1.0'da zaten tam."

