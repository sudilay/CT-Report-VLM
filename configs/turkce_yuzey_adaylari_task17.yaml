  # ============ E · SUPHE DERECESI DILI ============
  # Hedef: dagilim capasinin "derece ifadesi" ekseni (D76, docs/34 §6) ve
  # sema.py DERECE_DESENI'nin Turkce karsiligi.
  # ⚠ SINIFLANDIRILMADI. Hangi ifadenin hangi duzeye dustugu SEMA'nin
  #   isidir ve TASK-16'da karara baglanmistir; burada yalniz YUZEY var.

  derece_dili:
    malign_gorunumlu:
