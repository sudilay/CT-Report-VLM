  # ═══════════════════════════════════════════════════════════════════
  # `bulgu-1.2` ile eklenen 18 kavramin TR karsiliklari. Adaylar ve
  # kunyeler: configs/turkce_yuzey_adaylari_task17.yaml (aday-0.2).
  #
  # BAGLAYICI KURAL (D87, denetim B7): kaynagi olmayan yuzey GIRMEZ.
  # Iki mezuniyet yolu vardir ve her girdide hangisinden gectigi yazilidir:
  #   (a) KUNYE  - Turk radyoloji literaturunde belgelenmis
  #   (b) OLCUM  - RadTr train+dev'de gecti (test MUHURLU, D69)
  #
  # ⛔ GIRMEYEN: `complete_calcification`. Arastirma bu kavrami YANLIS
  #    esleyerek ("diffuz kalsifikasyon") dogruladi; o esleme D83'te
  #    olculup CURUTULDU (491 cumle, tamami damar ateromu). Dogru kavram
  #    icin TR kunyesi YOK ve RadTr'de 0. Kural geregi hazirlik dosyasinda
  #    BEKLIYOR - tahminle sozluge alinmadi.
  #
  # ⚠ ACIK CELISKI - `neoplasm`: bu dosyada `neoplaz` ZATEN `tumor`
  #    deseninin icinde (`t[uü]m[oö]r|neoplaz|kitlesel`). EN tarafinda
  #    `neoplasm` artik AYRI kavram. Ayirmak `tumor`un davranisini
  #    degistirirdi (dondurulmus tr-1.0), o yuzden YAPILMADI; celiski
  #    ILAN EDILDI ve `tr-2.0` yeniden turetmesine birakildi (plan §5).

